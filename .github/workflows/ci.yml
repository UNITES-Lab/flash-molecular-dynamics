name: ci

on:
  push:
    branches: [main, unify]
  pull_request:
  workflow_dispatch:
  schedule:
    # Weekly: the heavy tests download the published checkpoint.
    - cron: "17 6 * * 1"

permissions:
  contents: read

env:
  # The lock pins exact versions across the PyTorch CPU index, PyPI and the
  # PyG wheel page; let uv take each pin from whichever index has it.
  UV_INDEX_STRATEGY: unsafe-best-match

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: lint, types, CPU tests
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.3
        with:
          python-version: "3.12"
          activate-environment: true
          enable-cache: true
          cache-dependency-glob: requirements/ci-cpu.lock.txt

      # The lock pins torch to the CPU build that matches the torch-cluster
      # wheel; regenerate it with tools/ci/compile_lock.sh.
      - name: Install the locked CPU environment
        id: install
        run: |
          uv pip install -r requirements/ci-cpu.lock.txt
          uv pip install --no-deps -e .

      - name: Ruff lint
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: ruff check --output-format=github .
      - name: Ruff format
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: ruff format --check .
      - name: Mypy
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: mypy
      - name: CPU tests
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: pytest -m "not gpu and not heavy" -q

  heavy:
    name: heavy CPU tests
    if: ${{ github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.3
        with:
          python-version: "3.12"
          activate-environment: true
          enable-cache: true
          cache-dependency-glob: requirements/ci-cpu.lock.txt
      - name: Install the locked CPU environment
        run: |
          uv pip install -r requirements/ci-cpu.lock.txt
          uv pip install --no-deps -e .
      - name: Heavy tests
        run: pytest -m "heavy and not gpu" -q
