name: ci

on:
  push:
    branches: [main, unify]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - name: Ruff lint
        run: uvx ruff@0.15.21 check .
      - name: Ruff format
        run: uvx ruff@0.15.21 format --check .
      - name: Mypy on ported modules
        run: |
          uv venv
          uv pip install mypy==1.11.2 torch==2.10.0 --index-url https://download.pytorch.org/whl/cpu --extra-index-url https://pypi.org/simple
          uv run mypy

  test-cpu:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
      - name: Install CPU stack
        run: |
          uv venv --python 3.12
          uv pip install torch==2.10.0 --index-url https://download.pytorch.org/whl/cpu
          uv pip install torch_cluster -f https://data.pyg.org/whl/torch-2.10.0+cpu.html
          uv pip install -e ".[dev]"
      - name: Unit tests (no GPU)
        run: uv run pytest -m "not gpu and not heavy" -q
